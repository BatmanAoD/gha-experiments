name: on-merge
on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
jobs:
  report:
    if: github.event_name == 'push' || github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - run: echo "event=${{ github.event_name }} actor=${{ github.actor }} sha=${{ github.sha }}"
